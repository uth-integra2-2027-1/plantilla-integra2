{% extends "nucleo/base.html" %}
{% block titulo %}Tablero{% endblock %}
{% block contenido %}
<div class="grid">
  <div class="card"><h2>Uso de dispositivos por día</h2><canvas id="g1" height="160"></canvas></div>
  <div class="card"><h2>Encuesta (promedio 1–5)</h2><canvas id="g2" height="160"></canvas><p class="muted" id="n"></p></div>
</div>
<div class="card"><h2>Tiempo promedio de registro con QR</h2><p id="t" style="font-size:1.6rem;font-weight:700">—</p>
  <p><a class="btn" href="{% url 'exportar' %}">Descargar datos anonimizados (CSV)</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
fetch("{% url 'api_tablero' %}").then(r => r.json()).then(d => {
  new Chart(document.getElementById("g1"), {type:"line", data:{labels:d.dias, datasets:[
    {label:"Lecturas QR", data:d.series.qr}, {label:"Fotos", data:d.series.foto}, {label:"Impresiones", data:d.series.impresion}]}});
  const e = d.encuesta;
  new Chart(document.getElementById("g2"), {type:"bar", data:{labels:["Facilidad","Rapidez","Confianza"],
    datasets:[{label:"Promedio", data:[e.facilidad, e.rapidez, e.confianza]}]}, options:{scales:{y:{min:0, max:5}}}});
  document.getElementById("n").textContent = `${e.n} respuestas`;
  const t = d.tiempo_qr_ms;
  document.getElementById("t").textContent = t.prom ? `${(t.prom/1000).toFixed(2)} s (n = ${t.n})` : "Sin datos";
});
</script>
{% endblock %}
